services:
  postgres:
    image: postgres:16-alpine
    container_name: xlm-postgres
    environment:
      POSTGRES_USER: xlm
      POSTGRES_PASSWORD: xlm
      POSTGRES_DB: xlm
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xlm-net

  spark-master:
    image: apache/spark:3.5.0
    container_name: xlm-spark-master
    user: "0:0"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data_lake:/data_lake
    networks:
      - xlm-net

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: xlm-spark-worker-1
    user: "0:0"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./data_lake:/data_lake
    networks:
      - xlm-net

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: xlm-jupyter
    command: >
      bash -lc "python -c 'import pyspark' >/dev/null 2>&1 || pip install --no-cache-dir pyspark==3.5.0 delta-spark==3.2.0;
      start-notebook.sh"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=xlm
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
      - SPARK_MASTER=spark://spark-master:7077
      - LAKE_ROOT=/data_lake
    volumes:
      - ./data_lake:/home/jovyan/work/data_lake
      - ./data_lake:/data_lake
      - ./03_processing_silver:/home/jovyan/work/03_processing_silver
      - ./04_analytics_gold:/home/jovyan/work/04_analytics_gold
    ports:
      - "8888:8888"
    depends_on:
      - spark-master
    networks:
      - xlm-net

  streamlit:
    image: python:3.11-slim
    container_name: xlm-streamlit
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir streamlit pandas pyarrow plotly &&
      streamlit run app.py --server.address=0.0.0.0 --server.port=8501"
    environment:
      - LAKE_ROOT=/data_lake
    volumes:
      - ./05_dashboard_python:/app
      - ./data_lake:/data_lake
    ports:
      - "8501:8501"
    networks:
      - xlm-net

  pipeline-worker:
    image: jupyter/pyspark-notebook:latest
    container_name: xlm-pipeline-worker
    command:
      - bash
      - -lc
      - |
        python -c 'import pyspark' >/dev/null 2>&1 || pip install --no-cache-dir pyspark==3.5.0 delta-spark==3.2.0;
        echo "[pipeline-worker] started"; 
        while true; do
          echo "[pipeline-worker] tick: $(date -u +%FT%TZ)";
          python /home/jovyan/work/02_ingestion_bronze/ingest_to_bronze.py --max-files 200 || true;
          python /home/jovyan/work/03_processing_silver/transform_silver.py || true;
          python /home/jovyan/work/04_analytics_gold/transform_gold.py || true;
          sleep 60;
        done
    environment:
      - LAKE_ROOT=/data_lake
      - SPARK_MASTER=spark://spark-master:7077
    volumes:
      - ./data_lake:/home/jovyan/work/data_lake
      - ./data_lake:/data_lake
      - ./02_ingestion_bronze:/home/jovyan/work/02_ingestion_bronze
      - ./03_processing_silver:/home/jovyan/work/03_processing_silver
      - ./04_analytics_gold:/home/jovyan/work/04_analytics_gold
    depends_on:
      - spark-master
    restart: unless-stopped
    networks:
      - xlm-net

networks:
  xlm-net:
    driver: bridge
