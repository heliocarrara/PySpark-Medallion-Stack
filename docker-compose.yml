services:
  postgres:
    image: postgres:16-alpine
    container_name: xlm-postgres
    environment:
      POSTGRES_USER: xlm
      POSTGRES_PASSWORD: xlm
      POSTGRES_DB: xlm
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xlm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xlm-net

  spark-master:
    image: apache/spark:3.5.0
    container_name: xlm-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./data_lake:/data_lake
    networks:
      - xlm-net

  spark-worker-1:
    image: apache/spark:3.5.0
    container_name: xlm-spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    volumes:
      - ./data_lake:/data_lake
    networks:
      - xlm-net

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: xlm-jupyter
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=xlm
      - CHOWN_HOME=yes
      - CHOWN_HOME_OPTS=-R
      - SPARK_MASTER=spark://spark-master:7077
    volumes:
      - ./data_lake:/home/jovyan/work/data_lake
      - ./03_processing_silver:/home/jovyan/work/03_processing_silver
    ports:
      - "8888:8888"
    depends_on:
      - spark-master
    networks:
      - xlm-net

networks:
  xlm-net:
    driver: bridge
